<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pequisnake v4.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:white;font-family:system-ui;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#060916cc;z-index:20;padding:18px}.card{width:min(92vw,390px);background:#12192b;border-radius:20px;padding:22px;border:1px solid #ffffff20}.muted{opacity:.7;font-size:13px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff25;background:#090f1e;color:white;font-size:16px}button{border:0;border-radius:12px;font-weight:800}.primary{width:100%;padding:13px;margin-top:14px;background:#7cf29c}
.row{display:grid;grid-template-columns:1fr 70px;gap:12px}input[type=color]{height:44px;padding:0}
#hud,#rank{position:fixed;top:10px;z-index:5;background:#0008;border-radius:12px;padding:9px 11px;font-size:12px}#hud{left:10px}#rank{right:10px;min-width:155px;max-width:48vw}.rankline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bot{opacity:.7}
#mobile{display:none}#stick{position:fixed;left:24px;bottom:24px;width:126px;height:126px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff22;z-index:10}#knob{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:#ffffff55}#boost{position:fixed;right:24px;bottom:36px;width:92px;height:92px;border-radius:50%;z-index:10;background:#ffcf5c}
#death{display:none}@media(pointer:coarse),(max-width:800px){#mobile{display:block}}
</style></head><body>
<canvas id="game"></canvas><div id="hud">Sala: <b id="roomHud">-</b><br>Puntaje: <b id="score">0</b> · Posición: <b id="pos">-</b></div>
<div id="rank"><b>Tabla de posiciones</b><div id="rankList">—</div></div>
<div id="mobile"><div id="stick"><div id="knob"></div></div><button id="boost">TURBO</button></div>
<div id="menu" class="panel"><div class="card"><h1>Pequisnake</h1><div class="muted">v4.2 con 100 rivales automáticos y nombres aleatorios.</div><p>Nombre</p><input id="name" value="Jugador" maxlength="18"><div class="row"><div><p>Sala</p><input id="room" value="FAMILIA" maxlength="10"></div><div><p>Color</p><input id="color" type="color" value="#7cf29c"></div></div><button id="play" class="primary">Entrar a jugar</button></div></div>
<div id="death" class="panel"><div class="card"><h2>Perdiste</h2><button id="again" class="primary">Reaparecer</button></div></div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d"),coarse=matchMedia("(pointer:coarse)").matches||innerWidth<800;let DPR=Math.min(devicePixelRatio||1,1.5);
function resize(){c.width=innerWidth*DPR;c.height=innerHeight*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener("resize",resize);resize();
let ws,myId,joined=false,joinData,state={world:4200,foods:[],players:[],ranking:[]},cam={x:2100,y:2100,zoom:1},ang=0,boosting=false;
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/ws");ws.onopen=()=>{if(joined)setTimeout(()=>send({t:"join",...joinData}),100)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==="hello")myId=m.id;if(m.t==="joined"){roomHud.textContent=m.room;menu.style.display="none"}if(m.t==="state"){state=m;const me=state.players.find(p=>p.id===myId);if(me){score.textContent=Number.isFinite(me.score)?me.score:Math.round(me.length||0);const i=state.ranking.findIndex(r=>r.id===myId);pos.textContent=i>=0?(i+1)+"/"+state.ranking.length:"-";if(joined&&!me.alive)death.style.display="flex"}rankList.innerHTML=state.ranking.map((r,i)=>`<div class="rankline ${r.isBot?'bot':''}">${i+1}. ${r.name} — ${Number.isFinite(r.score)?r.score:Math.round(r.length||0)}</div>`).join("")||"—"}};ws.onclose=()=>setTimeout(connect,1200)}connect();
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
play.onclick=()=>{joinData={name:name.value.trim()||"Jugador",room:(room.value||"FAMILIA").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,10),color:color.value};joined=true;send({t:"join",...joinData})};again.onclick=()=>{send({t:"respawn"});death.style.display="none"};
c.addEventListener("pointermove",e=>{if(!coarse)ang=Math.atan2(e.clientY-innerHeight/2,e.clientX-innerWidth/2)});c.addEventListener("pointerdown",()=>{if(!coarse)boosting=true});addEventListener("pointerup",()=>{if(!coarse)boosting=false});
const stick=document.getElementById("stick"),knob=document.getElementById("knob");let sid=null;function sm(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,m=40;if(d>m){dx=dx/d*m;dy=dy/d*m}knob.style.transform=`translate(${dx}px,${dy}px)`;if(Math.hypot(dx,dy)>8)ang=Math.atan2(dy,dx)}
stick.addEventListener("pointerdown",e=>{sid=e.pointerId;stick.setPointerCapture(e.pointerId);sm(e)});stick.addEventListener("pointermove",e=>{if(e.pointerId===sid)sm(e)});stick.addEventListener("pointerup",e=>{sid=null;knob.style.transform="translate(0,0)"});
const bb=document.getElementById("boost");bb.addEventListener("pointerdown",()=>boosting=true);bb.addEventListener("pointerup",()=>boosting=false);bb.addEventListener("pointercancel",()=>boosting=false);
setInterval(()=>{if(joined)send({t:"input",angle:ang,boost:boosting})},66);
const sx=x=>(x-cam.x)*cam.zoom+innerWidth/2,sy=y=>(y-cam.y)*cam.zoom+innerHeight/2;
function draw(){ctx.fillStyle="#0b1020";ctx.fillRect(0,0,innerWidth,innerHeight);const me=state.players.find(p=>p.id===myId);if(me){cam.x+=(me.x-cam.x)*.13;cam.y+=(me.y-cam.y)*.13}
for(const f of state.foods){const X=sx(f[0]),Y=sy(f[1]);ctx.beginPath();ctx.fillStyle=`hsl(${f[3]} 95% 65%)`;ctx.arc(X,Y,f[2]*cam.zoom,0,Math.PI*2);ctx.fill()}
for(const p of state.players.filter(p=>p.alive)){if(!p.points.length)continue;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=p.color;ctx.lineWidth=p.radius*2*cam.zoom;ctx.beginPath();p.points.forEach((q,i)=>{const X=sx(q[0]),Y=sy(q[1]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();const X=sx(p.x),Y=sy(p.y),r=p.radius*cam.zoom;ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText(p.name,X,Y-r-8)}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
